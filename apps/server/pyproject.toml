[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.build-backend]
module-name = "arservercontroller"
module-root = ""

[tool.fastapi]
entrypoint = "arservercontroller.main:app"

[project.scripts]
arservercontroller = "arservercontroller.cli:main"

[project]
name = "arservercontroller"
version = "0.1.0"
description = "Arma Reforger Dedicated Server container manager."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
    "anyio>=4.15.1",
    "bcrypt>=5.0.0",
    "docker>=7.2.0",
    "fastapi[standard]>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.0b1",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ty>=0.0.76",
    "ruff>=0.16.6",
    "types-passlib>=1.7.7.20260211",
    "types-docker>=7.2.0.20260827",
]
test = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "pytest-asyncio>=1.3.0",
]
