[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.build-backend]
module-name = "arservercontroller"
module-root = ""

[project]
name = "arservercontroller"
version = "0.1.0"
description = "Arma Reforger Dedicated Server container manager."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.16.4",
    "anyio>=4.13.0",
    "bcrypt>=4.3.0",
    "docker>=7.1.0",
    "fastapi[standard]>=0.116.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-extra-types>=2.10.5",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "rich>=14.1.0",
    "sqlalchemy>=2.0.41",
]

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "ruff>=0.12.7",
    "types-passlib>=1.7.7.20250602",
    "types-docker>=7.1.0.20250705",
]
test = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
arservercontroller = "arservercontroller.cli:main"
